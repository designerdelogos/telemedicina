name: Package project

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/package-project.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project files
        run: |
          mkdir -p telemedicina
          rsync -a --exclude='.git' --exclude='.github' ./ telemedicina/

      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: telemedicina-atualizado
          path: telemedicina
          include-hidden-files: true
          retention-days: 1
